<!DOCTYPE html>
<html lang="en" data-mode="guest">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vividhata — Club Interview Passes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --paper:#FBF8F1;
  --ink:#0B1120;
  --jade:#17B57E;
  --marigold:#F5A524;
  --vermilion:#FF4B3E;
  --sky:#5B8CFF;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --display:'Bricolage Grotesque','Inter Tight',sans-serif;
  --body:'Inter Tight',system-ui,-apple-system,sans-serif;
  --fg:#F2EEE4;
  --fg-soft:#98A2BA;
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.07);
  --panel:rgba(10,15,27,.62);
  --field:rgba(255,255,255,.055);
  --r:18px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-mode="guest"]{--accent:var(--marigold);--on-accent:#17110A}
html[data-mode="staff"]{--accent:var(--sky);--on-accent:#FFFFFF}

html{scroll-behavior:smooth}
body{
  font-family:var(--body);color:var(--fg);min-height:100vh;overflow-x:hidden;
  background:#070B14;-webkit-font-smoothing:antialiased;
}

.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden}
.shot{
  position:absolute;inset:-4%;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.4s var(--ease);
  filter:saturate(.45) contrast(1.06) brightness(.72);
  animation:drift 46s ease-in-out infinite alternate;
}
.shot.guest{background-image:url("https://images.unsplash.com/photo-1492538368677-f6e0afe31dcc?auto=format&fit=crop&w=2000&q=70")}
.shot.staff{background-image:url("https://images.unsplash.com/photo-1519452575417-564c1401ecc0?auto=format&fit=crop&w=2000&q=70");animation-direction:alternate-reverse}
html[data-mode="guest"] .shot.guest{opacity:.5}
html[data-mode="staff"] .shot.staff{opacity:.4}
@keyframes drift{from{transform:scale(1.06) translate3d(0,0,0)}to{transform:scale(1.16) translate3d(-2%,-2%,0)}}
.scrim{
  position:absolute;inset:0;
  background:
    radial-gradient(1100px 700px at 78% -10%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 62%),
    linear-gradient(180deg,rgba(7,11,20,.74) 0%,rgba(7,11,20,.9) 55%,#070B14 100%);
  transition:background .9s var(--ease);
}
.grain{
  position:absolute;inset:0;opacity:.5;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);
}

.shell{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 24px 100px}

.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:16px 0;margin-bottom:8px;
  backdrop-filter:blur(16px);background:linear-gradient(to bottom,rgba(7,11,20,.92) 50%,transparent);
}
.mark{display:flex;align-items:center;gap:11px;flex-shrink:0;cursor:pointer}
.mark-badge{
  width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;
  box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 80%,transparent);transition:background .7s var(--ease)
}
.mark-txt{line-height:1.05}
.mark-txt b{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.02em;display:block}
.mark-txt span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--fg-soft);text-transform:uppercase}

nav{display:flex;gap:4px;margin-left:auto;background:var(--panel);border:1px solid var(--line-soft);padding:5px;border-radius:14px;backdrop-filter:blur(12px)}
nav button{
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--fg-soft);background:none;border:0;
  padding:9px 15px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:color .25s,background .25s;white-space:nowrap;position:relative;
}
nav button:hover{color:var(--fg)}
nav button.on{background:var(--accent);color:var(--on-accent)}
.badge{
  position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--vermilion);
  color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 4px;
  animation:pop .4s var(--ease) both;
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

.live{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;flex-shrink:0;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--jade);position:relative;flex-shrink:0}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--jade);animation:ping 1.9s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}

.view{animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line);max-width:120px}

h1.hero{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.92;font-size:clamp(42px,7vw,88px);text-wrap:balance}
h1.hero em{font-style:normal;color:var(--accent);position:relative}
h1.hero em::after{content:"";position:absolute;left:0;right:0;bottom:.07em;height:.07em;background:var(--accent);transform-origin:left;animation:swipe 1s var(--ease) .5s both}
@keyframes swipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lede{font-size:17px;line-height:1.6;color:var(--fg-soft);max-width:47ch;margin-top:22px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:40px 0 54px}

.cta-row{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{font-family:var(--body);font-size:14.5px;font-weight:600;padding:14px 24px;border-radius:13px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:transform .2s var(--ease),box-shadow .3s var(--ease),background .25s,color .25s,border-color .25s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 14px 28px -14px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 36px -14px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg);transform:translateY(-2px)}
.btn-solid{background:var(--fg);color:#0B1120}
.btn-solid:hover{transform:translateY(-2px)}
.btn-jade{background:var(--jade);color:#04150E}
.btn-red{background:transparent;border-color:rgba(255,75,62,.45);color:#FF8C82}
.btn-red:hover{background:rgba(255,75,62,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-sm{padding:10px 15px;font-size:13px;border-radius:11px}

.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.stat-cell{background:var(--panel);padding:22px 20px;backdrop-filter:blur(12px)}
.stat-cell .n{font-family:var(--display);font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat-cell .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--fg-soft);margin-top:9px}

/* ── pass ───────────────────────────────── */
.pass-stage{display:grid;place-items:center;perspective:1600px}
.pass{
  width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:22px;position:relative;overflow:hidden;
  box-shadow:0 46px 80px -34px rgba(0,0,0,.85),0 2px 0 rgba(255,255,255,.6) inset;
  animation:dealIn 1s var(--ease) both;
}
@keyframes dealIn{from{opacity:0;transform:rotateY(24deg) rotateX(10deg) translateY(40px)}to{opacity:1;transform:none}}
.pass.tilt{transform:rotate(-2.2deg)}
.pass::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.8) 46%,rgba(245,165,36,.2) 52%,transparent 68%);transform:translateX(-120%);animation:sheen 5.5s var(--ease) 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
.pass-top{background:var(--ink);color:#F2EEE4;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
.pass-top b{font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:.01em}
.pass-top span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;opacity:.6}
.pass-body{padding:20px 22px;display:flex;gap:18px;align-items:flex-start}
.face{width:76px;height:94px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#E4E0D5;border:1px solid rgba(11,17,32,.14);display:block}
.face.mono{display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:800;color:#8D95A8;letter-spacing:-.02em}
.pass-fields{flex:1;min-width:0}
.pf{margin-bottom:13px}
.pf:last-child{margin-bottom:0}
.pf label{font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:#8B93A6;display:block;margin-bottom:3px}
.pf p{font-size:15.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.pf p.code{font-family:var(--mono);font-size:13.5px;letter-spacing:.04em;color:#C4841A;font-weight:700}
.pf-row{display:flex;gap:18px}
.pf-row .pf{flex:1;min-width:0}

.perf{position:relative;height:1px}
.perf::before{content:"";position:absolute;left:20px;right:20px;top:0;border-top:2px dashed rgba(11,17,32,.2)}
.notch{position:absolute;width:26px;height:26px;border-radius:50%;background:#070B14;top:-13px}
.notch.l{left:-13px}.notch.r{right:-13px}

.pass-stub{padding:18px 22px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.stub-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#8B93A6;line-height:2}
.qr-box{background:#fff;padding:7px;border-radius:12px;border:1px solid rgba(11,17,32,.1);flex-shrink:0;display:grid;place-items:center}
.qr-box canvas,.qr-box img{display:block;border-radius:5px}
.qr-empty{width:142px;height:142px;display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;color:#A9B0C0;text-align:center;letter-spacing:.1em;line-height:1.9}
.flip{display:inline-flex;gap:2px}
.flip span{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;animation:flipin .42s var(--ease) both;animation-delay:calc(var(--c)*42ms);transform-origin:center bottom}
@keyframes flipin{0%{transform:rotateX(-92deg);opacity:0}60%{transform:rotateX(12deg);opacity:1}100%{transform:none}}
.chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:9px;margin-top:8px}
.chip.pending{background:rgba(245,165,36,.15);color:#A56A00;border:1px solid rgba(245,165,36,.4)}
.chip.admitted{background:rgba(23,181,126,.13);color:#0B7C55;border:1px solid rgba(23,181,126,.4)}
.chip.specimen{background:rgba(11,17,32,.06);color:#7B8398;border:1px solid rgba(11,17,32,.16)}
.pass-actions{padding:0 22px 20px;display:flex;gap:8px;flex-wrap:wrap}
.pass.capturing{transform:none;animation:none;box-shadow:none}
.pass.capturing::after{display:none}
.pass.capturing .pass-actions{display:none}
.pass.capturing .flip span{animation:none;transform:none;opacity:1}
.pass.capturing .notch{background:#0B1120}
.qr-full{position:fixed;inset:0;z-index:240;display:grid;place-items:center;padding:20px;background:rgba(5,8,14,.9);backdrop-filter:blur(10px);animation:fadeIn .28s var(--ease) both}
.qr-full-card{background:#fff;border-radius:24px;padding:26px;display:grid;justify-items:center;gap:12px;animation:nfIn .45s var(--ease) both}
.qr-full-card canvas,.qr-full-card img{display:block;border-radius:8px}
.qr-full-card b{font-family:var(--mono);font-size:17px;letter-spacing:.1em;color:#0B1120}
.qr-full-card span{font-size:13px;color:#6B7488}
.engine{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--fg-soft);align-self:center;padding-left:4px}
.cam-pick{font-family:var(--body);font-size:13px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:11px;padding:10px 12px;max-width:190px}
.cam-pick:focus{outline:none;border-color:var(--accent)}

/* ── forms ──────────────────────────────── */
.split{display:grid;grid-template-columns:1.02fr .98fr;gap:52px;align-items:start;padding-top:10px}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:30px;backdrop-filter:blur(16px)}
.card h2{font-family:var(--display);font-size:29px;font-weight:800;letter-spacing:-.035em;margin-bottom:6px}
.card .sub{color:var(--fg-soft);font-size:14.5px;margin-bottom:26px;line-height:1.55}

.field{margin-bottom:19px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--fg-soft);display:block;margin-bottom:8px}
.field input{width:100%;font-family:var(--body);font-size:15px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .25s,box-shadow .25s}
.field input::placeholder{color:#6E778E}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.field.bad input{border-color:var(--vermilion);animation:shake .42s var(--ease)}
.err{font-family:var(--mono);font-size:10.5px;color:#FF8C82;margin-top:7px;letter-spacing:.04em;line-height:1.6}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font-family:var(--body);font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:11px;cursor:pointer;background:var(--field);border:1px solid var(--line);color:var(--fg-soft);transition:all .22s var(--ease)}
.chips button:hover{border-color:var(--accent);color:var(--fg)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:translateY(-1px)}

.drop{display:flex;align-items:center;gap:16px;padding:14px;border:1.5px dashed var(--line);border-radius:14px;background:var(--field);transition:border-color .25s,background .25s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.drop-thumb{width:62px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--fg-soft)}
.drop-txt{flex:1;min-width:0}
.drop-txt b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.drop-txt span{font-size:12px;color:var(--fg-soft);line-height:1.5;display:block}
.link-btn{background:none;border:0;color:var(--accent);font-family:var(--body);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;margin-top:6px;text-decoration:underline;text-underline-offset:3px}

/* ── waiting / declined ─────────────────── */
.state-card{text-align:center;padding:52px 34px}
.pulser{width:92px;height:92px;margin:0 auto 26px;position:relative;display:grid;place-items:center;color:var(--accent)}
.pulser i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:ping 2.6s var(--ease) infinite}
.pulser i:nth-child(2){animation-delay:.85s}
.pulser i:nth-child(3){animation-delay:1.7s}
.state-card h3{font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.035em;margin-bottom:10px}
.state-card p{color:var(--fg-soft);font-size:14.5px;line-height:1.65;max-width:38ch;margin:0 auto}
.ticker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);margin-top:22px;text-transform:uppercase}
.refbox{font-family:var(--mono);font-size:15px;letter-spacing:.1em;background:var(--field);border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:24px}

/* ── not found overlay ──────────────────── */
.nf-wrap{position:fixed;inset:0;z-index:220;display:grid;place-items:center;padding:24px;background:rgba(5,8,14,.72);backdrop-filter:blur(8px);animation:fadeIn .3s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.nf-card{
  position:relative;width:100%;max-width:400px;text-align:center;padding:44px 34px 30px;border-radius:24px;overflow:hidden;
  background:rgba(16,10,12,.92);border:1px solid rgba(255,75,62,.32);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 70px -30px rgba(255,75,62,.5);
  animation:nfIn .5s var(--ease) both,shake .5s var(--ease) .5s;
}
@keyframes nfIn{from{opacity:0;transform:scale(.86) translateY(20px)}to{opacity:1;transform:none}}
.nf-mark{width:112px;height:112px;margin:0 auto 20px;display:block}
.nf-mark circle{fill:none;stroke:var(--vermilion);stroke-width:5;stroke-dasharray:327;stroke-dashoffset:327;animation:draw .6s var(--ease) .08s forwards;opacity:.85}
.nf-mark path{fill:none;stroke:var(--vermilion);stroke-width:7;stroke-linecap:round;stroke-dasharray:52;stroke-dashoffset:52;animation:draw .26s var(--ease) forwards}
.nf-mark path.s1{animation-delay:.5s}
.nf-mark path.s2{animation-delay:.72s}
@keyframes draw{to{stroke-dashoffset:0}}
.nf-card h3{font-family:var(--display);font-size:29px;font-weight:800;letter-spacing:-.04em;color:#FF6A5C;margin-bottom:12px;animation:rise .4s var(--ease) .55s both}
.nf-card p{color:#C9BCBA;font-size:14px;line-height:1.65;animation:rise .4s var(--ease) .65s both}
.nf-card p b{color:#F2EEE4;font-family:var(--mono);font-size:13px;word-break:break-all}
.nf-close{margin-top:24px;animation:rise .4s var(--ease) .75s both}
.nf-timer{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.nf-timer i{display:block;height:100%;background:var(--vermilion);transform-origin:left;animation:drain 3s linear both}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ── scanner ────────────────────────────── */
.scan-wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.viewport{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:#05080F;border:1px solid var(--line)}
.viewport video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:13%;pointer-events:none}
.reticle i{position:absolute;width:34px;height:34px;border:2.5px solid var(--accent);border-radius:5px;animation:brk 2.2s var(--ease) infinite}
.reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;animation-delay:.15s}
.reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;animation-delay:.3s}
.reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;animation-delay:.45s}
@keyframes brk{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.laser{position:absolute;left:13%;right:13%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 22px 3px color-mix(in srgb,var(--accent) 60%,transparent);animation:sweep 2.4s var(--ease) infinite}
@keyframes sweep{0%,100%{top:14%}50%{top:85%}}
.vp-idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;gap:14px;color:var(--fg-soft)}
.vp-idle p{font-size:13.5px;line-height:1.6;max-width:34ch}
.flash{position:absolute;inset:0;background:#fff;animation:flash .45s var(--ease) both;pointer-events:none}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

const beep = (f, dur, type = "sine", vol = 0.05) => {
  try {

    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;

    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
};

function Face({ src, seed, name, cls = "" }) {
  const url = src || faceFor(seed || name);
  const [bad, setBad] = useState(false);
  useEffect(() => setBad(false), [url]);
  if (bad) return <div className={"face mono " + cls}>{initials(name)}</div>;
  const remote = /^https?:/.test(url);
  return <img className={"face " + cls} src={url} alt=""
    crossOrigin={remote ? "anonymous" : undefined} onError={() => setBad(true)} />;
}

function Qr({ value, size = 142 }) {
  const [url, setUrl] = useState("");
  useEffect(() => {
    if (!value || !window.QRious) { setUrl(""); return; }
    const c = document.createElement("canvas");
    new window.QRious({ element: c, value, size, level: "M", padding: 8, background: "#ffffff", foreground: "#0B1120" });
    setUrl(c.toDataURL("image/png"));
  }, [value, size]);
  if (!value) return <div className="qr-empty">CODE<br />ISSUED ON<br />APPROVAL</div>;
  if (!url) return <div className="qr-empty">{value}</div>;
  return <img src={url} width={size} height={size} alt={value} />;
}

}

function Counter({ to, dur = 900 }) {
  const [v, setV] = useState(to);
  const from = useRef(to);
  useEffect(() => {
    const a = from.current, b = to;
    if (a === b) return;
    const t0 = performance.now();
    let raf;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      setV(Math.round(a + (b - a) * e));
      if (p < 1) raf = requestAnimationFrame(step); else from.current = b;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to, dur]);
  return <React.Fragment>{v}</React.Fragment>;
}

function Confetti({ fire }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!fire || !ref.current) return;
    const cv = ref.current, ctx = cv.getContext("2d");
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    const cols = ["#F5A524", "#17B57E", "#5B8CFF", "#FBF8F1", "#FF4B3E"];
    const bits = Array.from({ length: 130 }, () => ({
      x: cv.width / 2 + (Math.random() - .5) * 340, y: cv.height * .34,
      vx: (Math.random() - .5) * 13, vy: Math.random() * -15 - 5,
      w: 5 + Math.random() * 7, h: 8 + Math.random() * 10,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      c: cols[Math.floor(Math.random() * cols.length)], life: 1,
    }));
    let raf;
    const draw = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = false;
      bits.forEach(b => {
        b.vy += .42; b.vx *= .992; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > cv.height * .62) b.life -= .016;
        if (b.life > 0) {
          alive = true;
          ctx.save(); ctx.globalAlpha = Math.max(0, b.life);
          ctx.translate(b.x, b.y); ctx.rotate(b.r);
          ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          ctx.restore();
        }
      });
      if (alive) raf = requestAnimationFrame(draw); else ctx.clearRect(0, 0, cv.width, cv.height);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [fire]);
  return <canvas className="confetti" ref={ref} />;
}

function PhotoPicker({ value, onChange }) {
  const [over, setOver] = useState(false);
  const input = useRef(null);
  const take = (file) => {
    if (!file || !/^image\//.test(file.type)) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 420 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      onChange(c.toDataURL("image/jpeg", .86));
    };
    img.onerror = () => URL.revokeObjectURL(url);
    img.src = url;
  };
  return (
    <div className={"drop" + (over ? " over" : "")}
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); take(e.dataTransfer.files[0]); }}>
      {value
        ? <img className="drop-thumb" src={value} alt="" style={{ objectFit: "cover" }} />
        : <div className="drop-thumb"><Ic n="image" s={20} /></div>}
      <div className="drop-txt">
        <b>{value ? "Photo ready" : "Add your photo"}</b>
        <span>{value ? "This is what prints on your pass." : "Drop a file or browse. Leave it empty and we'll place a stock portrait."}</span>
        <button className="link-btn" onClick={() => value ? onChange(null) : input.current.click()}>
          {value ? "Remove photo" : "Browse files"}
        </button>
      </div>
      <input ref={input} type="file" accept="image/*" style={{ display: "none" }}
        onChange={e => { take(e.target.files[0]); e.target.value = ""; }} />
    </div>
  );
}

      if (list.indexOf("qr_code") >= 0) {
        native.current = new window.BarcodeDetector({ formats: ["qr_code"] });
        setEngine("native");
      }
    }).catch(() => {});
  }, []);

  const explain = (e) => {
    const n = e && e.name ? e.name : "";
    if (n === "NotAllowedError" || n === "PermissionDeniedError")
      return "Permission was denied. Click the camera icon in the address bar, allow access, then start again.";
    if (n === "NotFoundError" || n === "DevicesNotFoundError")
      return "No camera is attached to this device.";
    if (n === "NotReadableError" || n === "TrackStartError")
      return "Another app is holding the camera. Close Zoom, Teams, Meet or any other tab using it, then retry.";
    if (n === "OverconstrainedError") return "No camera matched the requested settings.";
    if (n === "SecurityError") return "Blocked because this page is not on a secure origin.";
    return (n || "Error") + (e && e.message ? " — " + e.message : "");
  };

  const loop = async (ts) => {
    raf.current = requestAnimationFrame(loop);
    const v = vid.current, c = buf.current;
    if (!v || !c || v.readyState < 2 || !v.videoWidth) return;
    if (ts - beat.current < 80 || Date.now() < lock.current) return;
    beat.current = ts;

    const w = v.videoWidth, h = v.videoHeight;
    let hit = null;

    if (native.current) {
      try {
        const codes = await native.current.detect(v);
        if (codes && codes.length && codes[0].rawValue) hit = codes[0].rawValue;
      } catch (e) {}
    }

    if (!hit && window.jsQR) {
      const ctx = c.getContext("2d", { willReadFrequently: true });
      const zoom = (turn.current++ % 2) === 0;
      if (zoom) {
        const side = Math.floor(Math.min(w, h) * 0.7);
        c.width = side; c.height = side;
        ctx.drawImage(v, Math.floor((w - side) / 2), Math.floor((h - side) / 2), side, side, 0, 0, side, side);
      } else {
        const k = Math.min(1, 800 / w);
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        ctx.drawImage(v, 0, 0, c.width, c.height);
      }
      try {
        const d = ctx.getImageData(0, 0, c.width, c.height);
        const r = window.jsQR(d.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
        if (r && r.data) hit = r.data;
      } catch (e) {}
    }

    if (hit && Date.now() > lock.current) {
      lock.current = Date.now() + 2600;
      setFlash(Date.now());
      cb.current(hit);
    }
  };

  const start = async (deviceId) => {
    setState("starting"); setWhy("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setWhy(window.isSecureContext
        ? "This browser exposes no camera API."
        : "Browsers only hand out the camera on a secure origin. Open this page through http://localhost or https://, not by double-clicking the file.");
      setState("blocked"); return;
    }
    if (stream.current) stream.current.getTracks().forEach(t => t.stop());
    const attempts = deviceId
      ? [{ video: { deviceId: { exact: deviceId } } }]
      : [{ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } } }, { video: true }];
    let got = null, last = null;
    for (let i = 0; i < attempts.length; i++) {
      try { got = await navigator.mediaDevices.getUserMedia(attempts[i]); break; }
      catch (e) { last = e; }
    }
    if (!got) { setWhy(explain(last)); setState("blocked"); return; }
    stream.current = got;
    const v = vid.current;
    v.srcObject = got;
    v.muted = true;
    v.setAttribute("playsinline", "");
    try { await v.play(); } catch (e) {}
    setState("live");
    try {
      const list = await navigator.mediaDevices.enumerateDevices();
      setCams(list.filter(d => d.kind === "videoinput"));
      const t = got.getVideoTracks()[0];
      if (t && t.getSettings) setCamId(t.getSettings().deviceId || "");
    } catch (e) {}
    cancelAnimationFrame(raf.current);
    raf.current = requestAnimationFrame(loop);
  };
  const stop = () => {
    cancelAnimationFrame(raf.current);
    if (stream.current) stream.current.getTracks().forEach(t => t.stop());
    stream.current = null;
    setState("idle");
  };
  useEffect(() => () => {
    cancelAnimationFrame(raf.current);
    if (stream.current) stream.current.getTracks().forEach(t => t.stop());
  }, []);

  const readImage = async (img) => {
    if (native.current) {
      try {
        const codes = await native.current.detect(img);
        if (codes && codes.length && codes[0].rawValue) return codes[0].rawValue;
      } catch (e) {}
    }
    if (!window.jsQR) return null;
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d", { willReadFrequently: true });
    const fit = Math.min(1, 1400 / Math.max(img.width, img.height));
    const scales = [1, 1.7, 0.6, 2.6];
    for (let i = 0; i < scales.length; i++) {
      const k = fit * scales[i];
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        const d = ctx.getImageData(0, 0, c.width, c.height);
        const r = window.jsQR(d.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
        if (r && r.data) return r.data;
      } catch (e) {}
    }
    return null;
  };

  const fromFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = async () => {
      const hit = await readImage(img);
      URL.revokeObjectURL(url);
      cb.current(hit || "__UNREADABLE__");
    };
    img.onerror = () => { URL.revokeObjectURL(url); cb.current("__UNREADABLE__"); };
    img.src = url;
    e.target.value = "";
  };

  return (
    <div>
      <div className="viewport">
        <video ref={vid} playsInline muted style={{ opacity: state === "live" ? 1 : 0 }} />
        <canvas ref={buf} style={{ display: "none" }} />
        {state === "live" && (
          <React.Fragment>
            <div className="reticle"><i /><i /><i /><i /></div>
            <div className="laser" />
            {flash > 0 && <div className="flash" key={flash} />}
          </React.Fragment>
        )}
        {state !== "live" && (
          <div className="vp-idle">
            <Ic n={state === "blocked" ? "bang" : "cam"} s={30} />
            <p>{state === "blocked"
              ? why + " Meanwhile the pass ID field and QR upload below check in exactly the same way."
              : state === "starting" ? "Waiting for camera permission…" : "Camera is off. Start it to read passes at the door."}</p>
            {state !== "starting" && <button className="btn btn-primary btn-sm" onClick={() => start()}><Ic n="cam" s={15} />{state === "blocked" ? "Try again" : "Start camera"}</button>}
          </div>
        )}
      </div>
      <div className="tools">
        {state === "live"
          ? <button className="btn btn-ghost btn-sm" onClick={stop}><Ic n="x" s={15} />Stop camera</button>
          : <button className="btn btn-ghost btn-sm" onClick={() => start()}><Ic n="cam" s={15} />Start camera</button>}
        {state === "live" && cams.length > 1 && (
          <select className="cam-pick" value={camId} onChange={e => { setCamId(e.target.value); start(e.target.value); }}>
            {cams.map((c, i) => <option key={c.deviceId || i} value={c.deviceId}>{c.label || "Camera " + (i + 1)}</option>)}
          </select>
        )}
        <label className="btn btn-ghost btn-sm" style={{ cursor: "pointer" }}>
          <Ic n="up" s={15} />Upload QR image
          <input type="file" accept="image/*" onChange={fromFile} style={{ display: "none" }} />
        </label>
        {state === "live" && <span className="engine">READER · {engine.toUpperCase()}</span>}
      </div>
    </div>
  );
}

function Verdict({ r }) {
  if (!r) return <div className="ro-empty">Point the camera at a pass. The result lands here and the register updates everywhere at once.</div>;
  if (r.status === "ok") return (
    <div className="verdict v-ok" key={r.k}>
      <div className="seal"><Ic n="check" s={36} /></div>
      <h3>ADMITTED</h3>
      <div className="who">{r.p.name}</div>
      <div className="meta">{r.p.code} · {r.p.domain.toUpperCase()}<br />SLOT {r.p.slot} · {r.p.org.toUpperCase()}<br />ENTERED {clock(r.p.at)}</div>
    </div>
  );
  if (r.status === "dup") return (
    <div className="verdict v-dup" key={r.k}>
      <div className="seal"><Ic n="bang" s={32} /></div>
      <h3>ALREADY IN</h3>
      <div className="who">{r.p.name}</div>
      <div className="meta">DUPLICATE SCAN BLOCKED<br />{r.p.code}<br />FIRST ENTRY {stamp(r.p.at)}</div>

  );
  if (r.status === "unread") return (
    <div className="verdict v-bad" key={r.k}>
      <div className="seal"><Ic n="image" s={32} /></div>
      <h3>NO CODE FOUND</h3>
      <div className="who">That image has no readable QR</div>
      <div className="meta">UPLOAD THE PASS PNG OR A PHOTO<br />OF THE QR ITSELF<br />OR TYPE THE PASS ID BELOW</div>
    </div>
  );
  return (
    <div className="verdict v-bad" key={r.k}>
      <div className="seal"><Ic n="x" s={32} /></div>
      <h3>NOT VALID</h3>
      <div className="who">No pass matches this code</div>
      <div className="meta">READ: {r.raw ? r.raw.slice(0, 32) : "UNREADABLE"}<br />SEND TO THE HELP DESK</div>
    </div>
  );
}

function Register({ people, feed, onReset, toast }) {
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const s = useMemo(() => {
    const total = people.length;
    const approved = people.filter(p => p.status === "approved").length;
    const inside = people.filter(p => p.attended).length;
    const waiting = people.filter(p => p.status === "pending").length;
    return { total, approved, inside, waiting, pct: approved ? Math.round(inside / approved * 100) : 0 };
  }, [people]);
  const rows = useMemo(() => {
    const t = q.trim().toLowerCase();
    return people.filter(p => {
      if (filter === "in" && !p.attended) return false;
      if (filter === "out" && !(p.status === "approved" && !p.attended)) return false;
      if (filter === "wait" && p.status !== "pending") return false;
      if (!t) return true;
      return (p.name + p.email + (p.code || "") + p.ref + p.org).toLowerCase().includes(t);
    });
  }, [people, filter, q]);
  const C = 2 * Math.PI * 44;

  const exportCsv = () => {
    const head = "Reference,PassID,Name,Email,Phone,CourseYear,Domain,Approval,Slot,Attendance,AppliedAt,CheckedInAt";
    const body = people.map(p => [p.ref, p.code || "", p.name, p.email, p.phone, p.org, p.domain,
      p.status, p.slot || "", p.attended ? "Attended" : "Not attended", p.applied, p.at || ""]
      .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","));
    const blob = new Blob([[head, ...body].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "vividhata-interviews.csv";
    a.click();
    toast("Register exported as CSV", "ok");
  };

  const tagFor = (p) => {
    if (p.status === "pending") return <span className="tag wait">IN REVIEW</span>;
    if (p.status === "declined") return <span className="tag no">DECLINED</span>;
    if (p.attended) return <span className="tag ok">ATTENDED</span>;
    return <span className="tag pend">SHORTLISTED</span>;
  };

  return (
    <div>
      <div className="dash-top">
        <div className="metrics">
          <div className="metric"><div className="n"><Counter to={s.total} /></div><div className="l">Applications</div></div>
          <div className="metric"><div className="n" style={{ color: "var(--accent)" }}><Counter to={s.waiting} /></div><div className="l">Awaiting review</div></div>
          <div className="metric"><div className="n"><Counter to={s.approved} /></div><div className="l">Shortlisted</div></div>
          <div className="metric"><div className="n" style={{ color: "var(--jade)" }}><Counter to={s.inside} /></div><div className="l">Interviewed</div></div>
        </div>
        <div className="donut">
          <svg width="108" height="108" viewBox="0 0 108 108">
            <circle className="trk" cx="54" cy="54" r="44" fill="none" strokeWidth="10" />
            <circle className="val" cx="54" cy="54" r="44" fill="none" strokeWidth="10" strokeLinecap="round"
              strokeDasharray={C} strokeDashoffset={C - C * s.pct / 100} transform="rotate(-90 54 54)" />
          </svg>
          <div>
            <div className="pctn"><Counter to={s.pct} />%</div>
            <div className="pctl">Turnout of<br />shortlisted</div>
          </div>
        </div>
      </div>

      <div className="grid2">
        <div className="panel">
          <div className="panel-head">
            <h3>Interview register</h3>
            <div className="searchbox">
              <Ic n="find" s={14} />
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search name, ref, ID" />
            </div>
            <div className="seg">
              <button className={filter === "all" ? "on" : ""} onClick={() => setFilter("all")}>All</button>
              <button className={filter === "wait" ? "on" : ""} onClick={() => setFilter("wait")}>Review</button>
              <button className={filter === "out" ? "on" : ""} onClick={() => setFilter("out")}>Expected</button>
              <button className={filter === "in" ? "on" : ""} onClick={() => setFilter("in")}>In</button>
            </div>
          </div>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>Candidate</th><th>Pass ID</th><th>Domain</th><th>Slot</th><th>Status</th><th>Entered</th></tr></thead>
              <tbody>
                {rows.map((p, i) => (
                  <tr key={p.id} style={{ "--i": i }}>
                    <td><div className="cellp">
                      <Face src={p.photo} seed={p.email} name={p.name} />
                      <div><div className="nm">{p.name}</div><div className="em">{p.org}</div></div>
                    </div></td>
                    <td className="mono">{p.code || p.ref}</td>
                    <td className="mono">{p.domain}</td>
                    <td className="mono">{p.slot || "—"}</td>
                    <td>{tagFor(p)}</td>
                    <td className="mono">{p.attended ? clock(p.at) : "—"}</td>
                  </tr>
                ))}
                {!rows.length && <tr><td colSpan="6" style={{ textAlign: "center", padding: 42, color: "var(--fg-soft)" }}>Nothing matches that search.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <div className="panel">
            <div className="panel-head"><h3>Door activity</h3><span style={{ marginLeft: "auto" }} className="dot" /></div>
            <div className="feed">
              {feed.length ? feed.map((f, i) => (
                <div className="feed-row" key={f.at + f.code} style={{ animationDelay: (i * 50) + "ms" }}>
                  <Face src={f.photo} seed={f.email} name={f.name} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="fn">{f.name}</div>
                    <div className="ft">{f.code}</div>
                  </div>
                  <div className="ft" style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--fg-soft)" }}>{clock(f.at)}</div>
                </div>
              )) : <div className="feed-empty">No scans yet in this session.<br />Check someone in and it appears here instantly.</div>}
            </div>
          </div>
          <div className="tools">
            <button className="btn btn-solid btn-sm" onClick={exportCsv}><Ic n="down" s={15} />Export CSV</button>
            <button className="btn btn-ghost btn-sm" onClick={onReset}><Ic n="reload" s={15} />Reset demo data</button>
          </div>
        </div>
      </div>
    </div>
  );
}

  }, [toast]);

  const approve = useCallback((id) => {
    const p = reg.current.find(x => x.id === id);
    if (!p) return;
    let code = newCode();
    while (reg.current.some(x => x.code === code)) code = newCode();
    const slot = slotAt(reg.current.filter(x => x.status === "approved").length);
    setPeople(prev => prev.map(x => x.id === id
      ? Object.assign({}, x, { status: "approved", code, slot, decided: new Date().toISOString() })
      : x));
    setFire(Date.now());
    soundOk();
    toast(p.name + " shortlisted · pass " + code, "ok");
  }, [toast]);

  const decline = useCallback((id) => {
    const p = reg.current.find(x => x.id === id);
    if (!p) return;
    setPeople(prev => prev.map(x => x.id === id
      ? Object.assign({}, x, { status: "declined", decided: new Date().toISOString() })
      : x));
    soundDup();
    toast(p.name + " marked not shortlisted", "warn");
  }, [toast]);

  const checkIn = useCallback((raw) => {
    let code = String(raw || "").trim();
    if (code === "__UNREADABLE__") {
      soundBad(); toast("No QR code found in that image", "bad");
      return { status: "unread" };
    }
    if (code.startsWith("{")) { try { code = JSON.parse(code).code || code; } catch (e) {} }
    code = code.toUpperCase();
    const p = reg.current.find(x => x.code === code);
    if (!p) { soundBad(); toast("No pass matches that code", "bad"); return { status: "bad", raw: code }; }
    if (p.attended) { soundDup(); toast(p.name + " already entered at " + clock(p.at), "warn"); return { status: "dup", p }; }
    const at = new Date().toISOString();
    const updated = Object.assign({}, p, { attended: true, at });
    setPeople(prev => prev.map(x => x.id === p.id ? updated : x));
    setFeed(prev => [{ name: p.name, code: p.code, email: p.email, photo: p.photo, at }, ...prev].slice(0, 25));
    setFire(Date.now());
    soundOk();
    toast(p.name + " checked in", "ok");
    return { status: "ok", p: updated };
  }, [toast]);

  const reset = useCallback(() => {
    setPeople(SEED); setFeed([]); setSubmitted(null);
    toast("Demo data restored", "ok");
  }, [toast]);

  const NAV = [
    ["home", "Home", "home"],
    ["apply", "Apply", "add"],
    ["pass", "My pass", "ticket"],
    ["desk", "Coordinator", "shield"],
  ];

  return (
    <div className="shell">
      <header className="topbar">
        <div className="mark" onClick={() => setRoute("home")}>
          <div className="mark-badge">V</div>
          <div className="mark-txt"><b>{CLUB.name}</b><span>{CLUB.edition}</span></div>
        </div>
        <nav>
          {NAV.map(([r, label, icon]) => (
            <button key={r}
              className={route === r || (r === "apply" && route === "submitted") ? "on" : ""}
              onClick={() => setRoute(r)}>
              <Ic n={icon} s={15} />{label}
              {r === "desk" && stats.waiting > 0 && <span className="badge">{stats.waiting}</span>}
            </button>
          ))}
        </nav>
        <div className="live"><span className="dot" />{stats.inside}/{stats.approved} IN</div>
      </header>

      <main key={route}>
        {route === "home" && <Home stats={stats} go={setRoute} />}
        {route === "apply" && <Apply onApply={apply} toast={toast} />}
        {route === "submitted" && submitted && <Submitted p={submitted} go={setRoute} />}
        {route === "pass" && <Lookup people={people} notFound={setMissing} />}
        {route === "desk" && <Desk people={people} feed={feed} checkIn={checkIn}
          approve={approve} decline={decline} onReset={reset} toast={toast} pending={stats.waiting} />}
      </main>

      <footer className="foot">
        <span>{CLUB.name} · {CLUB.venue} · {CLUB.day}</span>
        <span>Passes are single-use · duplicate scans are refused</span>
      </footer>

      <div className="toasts">
        {toasts.map(t => (
          <div className={"toast " + t.kind} key={t.id}>
            <Ic n={t.kind === "ok" ? "check" : t.kind === "warn" ? "bang" : "x"} s={16} />{t.message}
          </div>
        ))}
      </div>
      {missing && <NotFound query={missing} onClose={() => setMissing(null)} />}
      <Confetti fire={fire} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
